{% extends 'base.html' %}{% block content %}
<div class="pagehead"><div><span class="eyebrow">EMPLEADOS</span><h1>{{'Editar' if employee else 'Nuevo'}} empleado</h1><p>Completa el perfil. El grupo de nómina define las cuentas contables que se usarán al contabilizar en Siigo.</p></div></div>
<div class="panel"><form method="post"><div class="reviewgrid"><div>
{% if not employee %}<label>Documento</label><input class="field" name="document" required>{% endif %}
<label>Nombre completo</label><input class="field" name="name" value="{{employee.name if employee else ''}}" required>
<label>Nombres</label><input class="field" name="first_name" value="{{employee.first_name if employee else ''}}">
<label>Apellidos</label><input class="field" name="last_name" value="{{employee.last_name if employee else ''}}">
<label>Salario base</label><input class="field" type="number" step="0.01" name="salary_base" value="{{employee.salary_base if employee else ''}}"><label>Auxilio de transporte mensual</label><input class="field" type="number" step="0.01" name="transport_allowance" value="{{employee.transport_allowance if employee else ''}}">
<label>Grupo de nómina</label>
<select class="field" name="payroll_group" required>
  <option value="">Selecciona...</option>
  {% for g in ['Administración','Ventas','Producción'] %}<option value="{{g}}" {% if employee and employee.payroll_group==g %}selected{% endif %}>{{g}}</option>{% endfor %}
</select>
<label>EPS / Fondo salud</label><input class="field" name="health_provider" value="{{employee.health_provider if employee else ''}}" placeholder="Ej. EPS Sura">
<label>Fondo de pensión</label><input class="field" name="pension_provider" value="{{employee.pension_provider if employee else ''}}" placeholder="Ej. Protección S.A.">
<label>ARL</label><input class="field" name="arl_provider" value="{{employee.arl_provider if employee else ''}}" placeholder="Ej. Seguros de Vida Suramericana">
<label>Fondo de cesantías</label><input class="field" name="severance_fund" value="{{employee.severance_fund if employee else ''}}" placeholder="Ej. Protección">
<label>Caja de compensación</label><input class="field" name="compensation_fund" value="{{employee.compensation_fund if employee else ''}}" placeholder="Ej. Comfama">
</div><div>
<label>Correo</label><input class="field" type="email" name="email" value="{{employee.email if employee else ''}}">
<label>Teléfono</label><input class="field" name="phone" value="{{employee.phone if employee else ''}}">
<label>Dirección</label><input class="field" name="address" value="{{employee.address if employee else ''}}">
<label>Ciudad</label><input class="field" name="city" value="{{employee.city if employee else ''}}">
<label>Cargo</label><input class="field" name="position" value="{{employee.position if employee else ''}}">
<label>Tipo de contrato</label><input class="field" name="contract_type" value="{{employee.contract_type if employee else ''}}">
<label>Fecha inicio contrato</label><input class="field" type="date" name="contract_start" value="{{employee.contract_start if employee else ''}}">
<label>Fecha fin contrato</label><input class="field" type="date" name="contract_end" value="{{employee.contract_end if employee else ''}}">
<label>Tipo de salario</label><input class="field" name="salary_type" value="{{employee.salary_type if employee else 'Ordinario'}}">
<label>Banco</label><input class="field" name="bank" value="{{employee.bank if employee else ''}}">
<label>Código banco</label><input class="field" name="bank_code" value="{{employee.bank_code if employee else ''}}">
<label>Tipo de cuenta</label><input class="field" name="bank_account_type" value="{{employee.bank_account_type if employee else ''}}" placeholder="CA / CC">
<label>Cuenta</label><input class="field" name="bank_account" value="{{employee.bank_account if employee else ''}}">
<label>Correo para pago</label><input class="field" type="email" name="payment_email" value="{{employee.payment_email if employee else ''}}">
</div></div><button class="btn yellow">Guardar empleado</button></form></div>{% endblock %}
